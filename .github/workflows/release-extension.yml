name: Release extension

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read extension version
        id: meta
        run: |
          VERSION="$(node -p "require('./apps/extension/package.json').version")"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          TAG="extension-v${VERSION}-${SHORT_SHA}"
          ZIP_NAME="privateai-browser-extension-${VERSION}-chrome.zip"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "zip_name=${ZIP_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Chrome Web Store zip
        run: pnpm --filter @privateai/browser-extension zip

      - name: Rename zip for release
        run: |
          SRC="$(ls apps/extension/.output/*-chrome.zip | head -n1)"
          cp "$SRC" "apps/extension/.output/${{ steps.meta.outputs.zip_name }}"
          ls -lh apps/extension/.output/*.zip

      # Auth + options via env (private key has newlines; CLI flags break them).
      - name: Publish to Chrome Web Store
        working-directory: apps/extension
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: bknhphccokmmlbjcmlnnlanpcoebhfbp
          CHROME_PUBLISHER_ID: ce40d4b2-4148-4b2d-8d7f-c9c725683baf
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_CANCEL_PENDING: "true"
          CHROME_ZIP: .output/${{ steps.meta.outputs.zip_name }}
        run: |
          if [ -z "${CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL}" ] || [ -z "${CHROME_SERVICE_ACCOUNT_PRIVATE_KEY}" ]; then
            echo "Missing Chrome Web Store secrets; failing publish."
            exit 1
          fi
          pnpm exec publish-extension

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PrivateAI Browser ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.tag }})
          body: |
            Chrome extension package for PrivateAI Browser / Open WebUI bridge.

            - Version: `${{ steps.meta.outputs.version }}`
            - Commit: `${{ github.sha }}`
            - Submitted to the Chrome Web Store automatically (item `bknhphccokmmlbjcmlnnlanpcoebhfbp`).
          files: apps/extension/.output/${{ steps.meta.outputs.zip_name }}
          make_latest: true
          fail_on_unmatched_files: true
